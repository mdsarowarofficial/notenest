name: notenest
description: NoteNest — personal academic workspace for students.
publish_to: "none"
version: 1.0.2+3

environment:
  # Raised from 3.0.0 for Activity 06: the audio and speech packages below
  # declare a newer floor of their own, and leaving the app's floor at 3.0.0
  # makes pub quietly resolve to an older version of them with a different API.
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  crypto: ^3.0.7
  file_picker: ^13.1.0
  flutter:
    sdk: flutter
  image_cropper: ^12.2.1
  image_picker: ^1.2.3
  path: ^1.9.1
  path_provider: ^2.1.6
  sqflite: ^2.4.3
  sqflite_common_ffi_web: ^1.1.2
  syncfusion_flutter_pdfviewer: ^35.1.37

  # Activity 06 — Voice & Smart Notes.
  # record writes the lecture to an m4a file, audioplayers plays it back, and
  # speech_to_text drives the device's own recogniser for dictation. Nothing
  # here sends audio to a server of ours; speech_to_text hands the microphone
  # to whatever recogniser the platform already provides.
  audioplayers: ^6.8.1
  record: ^7.1.2
  speech_to_text: ^7.5.0

  # Activity 07 — Sharing & Collaboration.
  # There is no NoteNest server, so a note is handed over as a file through
  # whatever app the students already use. share_plus opens the system share
  # sheet; file_picker, already here for PDFs, reads the file on the way back.
  share_plus: ^13.3.1

  # Activity 09 — Documents: cover pages, and PDF ↔ Word.
  #
  # `pdf` writes the file. It does not draw the text — Flutter does, and the
  # page is captured as an image — because `pdf` has no OpenType shaping
  # engine and would break Bengali conjuncts apart (dart_pdf issue #198).
  #
  # `archive` and `xml` read and write a .docx, which is a zip of XML parts.
  #
  # `syncfusion_flutter_pdf` pulls the text out of a PDF. It was already here
  # as a dependency of syncfusion_flutter_pdfviewer, pinned to the same
  # version; it is named now because this code imports it directly, and a
  # package you import is one you should declare.
  archive: ^4.5.1
  image: ^4.12.0
  pdf: ^3.13.1
  syncfusion_flutter_pdf: ^35.1.37
  xml: ^7.0.1

  # Activity 10 — the cloud side. Declared here so this file never drops them
  # again: a zip that ships pubspec.yaml overwrites whatever `flutter pub add`
  # put in, and that is exactly how firebase_core went missing once already.
  cloud_firestore: ^6.10.0
  firebase_auth: ^6.7.0
  firebase_core: ^4.15.0

  # Activity 11 — signing in with a Google account.
  #
  # Version 7 and not 6: the API changed shape (GoogleSignIn.instance,
  # authenticate(), a separate authorization client for access tokens), and 6 is
  # the version every older tutorial shows. Pinning the major here is what stops
  # a later `pub upgrade` from quietly swapping one API for the other.
  #
  # On Android this needs the signing fingerprint of *each* build — debug and
  # release both — registered against com.notenest.app in the Firebase project,
  # and google-services.json re-downloaded afterwards so it carries the web
  # OAuth client entry. Without that, sign-in fails as a *cancellation*, which
  # is the single most misleading error in this whole dependency.
  google_sign_in: ^7.2.0
  http: ^1.6.0
  url_launcher: ^6.3.3
  flutter_local_notifications: ^22.3.2
  timezone: ^0.11.2
  flutter_timezone: ^5.1.1
  local_auth: ^3.0.2
  firebase_messaging: ^16.7.0

  # Optional, for the intended typefaces. After adding it, open
  # lib/theme/nest_theme.dart and set the NestFont values.
  # google_fonts: ^6.2.1

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter
  # The planner widget test opens a real SQLite database on the desktop.
  sqflite_common_ffi: ^2.4.2

flutter:
  uses-material-design: true

  assets:
    # About 10,250 institutions in 200 countries, names and domains only —
    # roughly 670 KB. Carried in the app so picking a university works with no
    # connection. Logos are deliberately not here; see data/brand_store.dart.
    - assets/universities.json

  # Bundled rather than fetched from Google Fonts.
  #
  # Not only for speed: the app has already failed in the field because it
  # could not reach fonts.gstatic.com, and a notebook that promises to work
  # offline cannot depend on a font server to be readable. Both families are
  # SIL Open Font License, so shipping them is free and allowed.
  #
  # Only the weights actually used are carried — 664 KB in total.
  fonts:
    - family: Outfit
      fonts:
        - asset: assets/fonts/Outfit-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Outfit-Bold.ttf
          weight: 700
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
