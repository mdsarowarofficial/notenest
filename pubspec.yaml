name: notenest
description: NoteNest — personal academic workspace for students.
publish_to: "none"
version: 0.1.0+1

environment:
  # Raised from 3.0.0 for Activity 06: the audio and speech packages below
  # declare a newer floor of their own, and leaving the app's floor at 3.0.0
  # makes pub quietly resolve to an older version of them with a different API.
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  crypto: ^3.0.7
  file_picker: ^13.1.0
  flutter:
    sdk: flutter
  image_cropper: ^12.2.1
  image_picker: ^1.2.3
  path: ^1.9.1
  path_provider: ^2.1.6
  sqflite: ^2.4.3
  sqflite_common_ffi_web: ^1.1.2
  syncfusion_flutter_pdfviewer: ^35.1.37

  # Activity 06 — Voice & Smart Notes.
  # record writes the lecture to an m4a file, audioplayers plays it back, and
  # speech_to_text drives the device's own recogniser for dictation. Nothing
  # here sends audio to a server of ours; speech_to_text hands the microphone
  # to whatever recogniser the platform already provides.
  audioplayers: ^6.8.1
  record: ^7.1.2
  speech_to_text: ^7.5.0

  # Activity 07 — Sharing & Collaboration.
  # There is no NoteNest server, so a note is handed over as a file through
  # whatever app the students already use. share_plus opens the system share
  # sheet; file_picker, already here for PDFs, reads the file on the way back.
  share_plus: ^13.3.1

  # Optional, for the intended typefaces. After adding it, open
  # lib/theme/nest_theme.dart and set the NestFont values.
  # google_fonts: ^6.2.1

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
